<!DOCTYPE html>
<html>
<head>
    <title>NZXT Test</title>
    <style>
        body{
            margin:0;
            background:black;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:Arial,sans-serif;
            font-size:24px;
        }
    </style>
</head>
<body>
    <div id="temp">Waiting for NZXT...</div>

    <script>
        window.nzxt = {
            v1: {
                onMonitoringDataUpdate: (data) => {
                    const cpuTemp = data.cpus?.[0]?.temperature ?? "--";
                    document.getElementById("temp").innerText =
                        `CPU ${Math.round(cpuTemp)}°`;
                }
            }
        };
    </script>
</body>
</html>
